# Cilium for k3s/Raspberry Pi.

k8sServiceHost: 192.168.1.253
k8sServicePort: "6443"
kubeProxyReplacement: "true"

# Enable Cilium L2-aware LoadBalancer on the LAN.
l2announcements:
  enabled: true
  leaseDuration: 30s
  leaseRenewDeadline: 15s
  leaseRetryPeriod: 3s

# L2 announcements and the operator use Kubernetes Leases; keep API client
# throttling explicit for small single-node k3s environments.
k8sClientRateLimit:
  qps: 20
  burst: 40
  operator:
    qps: 100
    burst: 200

enableIPv4Masquerade: true
ipv6:
  enabled: false
bpf:
  masquerade: true

# Enable Gateway API (Cilium Envoy).
gatewayAPI:
  enabled: true
  gatewayClass:
    create: "true"
envoy:
  prometheus:
    serviceMonitor:
      enabled: false

authentication:
  enabled: true
  mutual:
    spire:
      enabled: false  # We are not using SPIRE for now, a PR is fixing it https://github.com/cilium/cilium/issues/40533.

operator:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  prometheus:
    metricsService: true
    serviceMonitor:
      enabled: false
  dashboards:
    enabled: true

devices: eth0

prometheus:
  metricsService: true
  enabled: true
  # ServiceMonitor CRDs are installed later by kube-prometheus-stack.
  # Keep Terraform-owned Cilium bootstrap independent from observability CRDs.
  serviceMonitor:
    enabled: false
    labels:
      release: kube-prometheus-stack

dashboards:
  enabled: true

hubble:
  enabled: true
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp
      - httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction
    enableOpenMetrics: true
    serviceMonitor:
      enabled: false
    dashboards:
      enabled: true
  relay:
    enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: false
  ui:
    enabled: true
    frontend:
      securityContext:
        readOnlyRootFilesystem: false
