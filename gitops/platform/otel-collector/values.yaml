mode: daemonset

fullnameOverride: otel-collector
namespaceOverride: monitoring

image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib

service:
  enabled: true
  type: ClusterIP

serviceAccount:
  create: true
  automountServiceAccountToken: true

clusterRole:
  create: true
  rules:
    - apiGroups:
        - ""
      resources:
        - namespaces
        - nodes
        - pods
      verbs:
        - get
        - list
        - watch

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

tolerations:
  - effect: NoSchedule
    operator: Exists
  - effect: NoExecute
    operator: Exists

extraVolumes:
  - name: varlog
    hostPath:
      path: /var/log
      type: Directory

extraVolumeMounts:
  - name: varlog
    mountPath: /var/log
    readOnly: true

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    hostPort: null
    protocol: TCP
    appProtocol: grpc
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    hostPort: null
    protocol: TCP
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
    protocol: TCP

serviceMonitor:
  enabled: true
  extraLabels:
    release: kube-prometheus-stack
  metricsEndpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s

alternateConfig:
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133

  receivers:
    filelog:
      include:
        - /var/log/pods/*/*/*.log
      exclude:
        - /var/log/pods/monitoring_otel-collector-*/*/*.log
      start_at: end
      include_file_path: true
      include_file_name: false
      retry_on_failure:
        enabled: true
      operators:
        - type: regex_parser
          id: extract_metadata_from_filepath
          parse_from: attributes["log.file.path"]
          regex: ^.*/(?P<namespace>[^_]+)_(?P<pod_name>[^_]+)_(?P<pod_uid>[a-f0-9-]+)/(?P<container_name>[^/]+)/(?P<restart_count>\d+)\.log$
        - type: move
          from: attributes.namespace
          to: resource["k8s.namespace.name"]
        - type: move
          from: attributes.pod_name
          to: resource["k8s.pod.name"]
        - type: move
          from: attributes.pod_uid
          to: resource["k8s.pod.uid"]
        - type: move
          from: attributes.container_name
          to: resource["k8s.container.name"]
        - type: move
          from: attributes.restart_count
          to: resource["k8s.container.restart_count"]
        - type: container
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318
  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    k8sattributes:
      auth_type: serviceAccount
      passthrough: false
      pod_association:
        - sources:
            - from: resource_attribute
              name: k8s.pod.uid
        - sources:
            - from: resource_attribute
              name: k8s.pod.ip
        - sources:
            - from: connection
      extract:
        metadata:
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.deployment.name
          - k8s.node.name
        labels:
          - tag_name: app
            key: app.kubernetes.io/name
            from: pod
          - tag_name: app.kubernetes.io/instance
            key: app.kubernetes.io/instance
            from: pod
    resource:
      attributes:
        - action: upsert
          key: service.namespace
          from_attribute: k8s.namespace.name
        - action: upsert
          key: service.name
          from_attribute: app
    batch:
      timeout: 5s
      send_batch_size: 1024

  exporters:
    otlphttp/loki:
      endpoint: http://loki-gateway.monitoring.svc.cluster.local/otlp

  service:
    telemetry:
      resource:
        k8s.namespace.name: ${env:OTEL_K8S_NAMESPACE}
        k8s.node.name: ${env:OTEL_K8S_NODE_NAME}
        k8s.node.ip: ${env:OTEL_K8S_NODE_IP}
        k8s.pod.name: ${env:OTEL_K8S_POD_NAME}
        k8s.pod.ip: ${env:OTEL_K8S_POD_IP}
        host.name: ${env:OTEL_K8S_NODE_NAME}
      metrics:
        readers:
          - pull:
              exporter:
                prometheus:
                  host: ${env:MY_POD_IP}
                  port: 8888
    extensions:
      - health_check
    pipelines:
      logs:
        receivers:
          - filelog
          - otlp
        processors:
          - memory_limiter
          - k8sattributes
          - resource
          - batch
        exporters:
          - otlphttp/loki
