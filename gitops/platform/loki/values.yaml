loki:
  enabled: true
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

defaults:
  hostUsers: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false

deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  sidecar: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  persistence:
    enabled: true
    size: 20Gi

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0

gateway:
  enabled: true
  hostUsers: false
  affinity: null
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  nginxConfig:
    enableIPv6: false
  metrics:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi

memberlist:
  service:
    publishNotReadyAddresses: true

networkPolicy:
  enabled: true
  flavor: cilium
  egressWorld:
    enabled: false
  egressKubeApiserver:
    enabled: true

promtail:
  enabled: false

# Disable the Grafana bundled with Loki, because we use the one in kube-prometheus-stack
grafana:
  enabled: false
