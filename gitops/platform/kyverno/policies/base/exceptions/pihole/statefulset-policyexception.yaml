apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: pihole-statefulset-root-user
  namespace: pihole
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  policyRefs:
    - kind: ValidatingPolicy
      name: require-run-as-nonroot
  matchConditions:
    - name: only-pihole-statefulset
      expression: >-
        request.namespace == 'pihole' && (
          (
            request.resource.group == 'apps' &&
            request.resource.resource == 'statefulsets' &&
            object.metadata.name == 'pihole' &&
            object.spec.template.spec.securityContext.runAsNonRoot == false &&
            object.spec.template.spec.securityContext.seccompProfile.type == 'RuntimeDefault' &&
            object.spec.template.spec.containers.exists(container,
              container.name == 'pihole' &&
              container.image.startsWith('pihole/pihole:') &&
              container.securityContext.runAsNonRoot == false &&
              container.securityContext.allowPrivilegeEscalation == false &&
              container.securityContext.readOnlyRootFilesystem == false &&
              container.securityContext.seccompProfile.type == 'RuntimeDefault'
            )
          ) ||
          (
            request.resource.group == '' &&
            request.resource.resource == 'pods' &&
            object.metadata.name.startsWith('pihole-') &&
            object.metadata.ownerReferences.exists(owner,
              owner.kind == 'StatefulSet' &&
              owner.name == 'pihole'
            ) &&
            object.spec.securityContext.runAsNonRoot == false &&
            object.spec.securityContext.seccompProfile.type == 'RuntimeDefault' &&
            object.spec.containers.exists(container,
              container.name == 'pihole' &&
              container.image.startsWith('pihole/pihole:') &&
              container.securityContext.runAsNonRoot == false &&
              container.securityContext.allowPrivilegeEscalation == false &&
              container.securityContext.readOnlyRootFilesystem == false &&
              container.securityContext.seccompProfile.type == 'RuntimeDefault'
            )
          )
        )
