apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: node-exporter-host-access
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  policyRefs:
    - kind: ValidatingPolicy
      name: disallow-host-namespaces
    - kind: ValidatingPolicy
      name: disallow-host-path
    - kind: ValidatingPolicy
      name: disallow-host-ports
    - kind: ValidatingPolicy
      name: restrict-volume-types
  matchConditions:
    - name: only-prometheus-node-exporter
      expression: >-
        request.namespace == 'monitoring' && (
          (
            request.resource.group == 'apps' &&
            request.resource.resource == 'daemonsets' &&
            object.metadata.name == 'kube-prometheus-stack-prometheus-node-exporter' &&
            object.spec.template.spec.hostNetwork == true &&
            object.spec.template.spec.hostPID == true &&
            object.spec.template.spec.volumes.all(volume,
              !has(volume.hostPath) ||
              (
                volume.hostPath.path in ['/', '/proc', '/sys'] &&
                (!has(volume.hostPath.type) || volume.hostPath.type == 'Directory')
              )
            ) &&
            object.spec.template.spec.containers.exists(container,
              container.name == 'node-exporter'
            )
          ) ||
          (
            request.resource.group == '' &&
            request.resource.resource == 'pods' &&
            object.metadata.ownerReferences.exists(owner,
              owner.kind == 'DaemonSet' &&
              owner.name == 'kube-prometheus-stack-prometheus-node-exporter'
            ) &&
            object.spec.hostNetwork == true &&
            object.spec.hostPID == true &&
            object.spec.volumes.all(volume,
              !has(volume.hostPath) ||
              (
                volume.hostPath.path in ['/', '/proc', '/sys'] &&
                (!has(volume.hostPath.type) || volume.hostPath.type == 'Directory')
              )
            ) &&
            object.spec.containers.exists(container,
              container.name == 'node-exporter'
            )
          )
        )
